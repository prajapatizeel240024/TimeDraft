<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 862" width="760" height="862" role="img" aria-labelledby="title desc">
<title id="title">Claude judges, code counts the time, and one service writes every entry</title>
<desc id="desc">Read it top down: the screen (through the API routes), the CLI and the evals all drive the same server code. Claude is reached only through the LLM client, entries and audit rows are written only by the entries service, and all state lives in local Postgres.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; } .ink { fill: #1f1f1d; } .quiet { fill: #5f5e59; }
  .line { fill: none; stroke: #9b9a94; stroke-width: 1.25; } .guide { fill: none; stroke: #d9d8d3; stroke-width: 1.25; }
  .dash { stroke-dasharray: 4 4; } .box { fill: none; stroke: #9b9a94; stroke-width: 1.25; }
  .main { fill: #2c6ecb; fill-opacity: 0.12; stroke: #2c6ecb; stroke-width: 2; }
  .tint { fill: #f2f1ed; stroke: #9b9a94; stroke-width: 1.25; } .head { fill: #9b9a94; }
  .span { fill: #9b9a94; fill-opacity: 0.18; stroke: #9b9a94; stroke-width: 1.25; }
  .span-main { fill: #2c6ecb; fill-opacity: 0.18; stroke: #2c6ecb; stroke-width: 1.25; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1c1b; } .ink { fill: #ecebe6; } .quiet { fill: #a9a8a2; }
    .line, .box { stroke: #74736d; } .guide { stroke: #3a3936; }
    .main { fill: #6fa2ff; fill-opacity: 0.16; stroke: #6fa2ff; }
    .tint { fill: #262624; stroke: #74736d; } .head { fill: #74736d; }
    .span { fill: #74736d; stroke: #74736d; } .span-main { fill: #6fa2ff; stroke: #6fa2ff; }
  }
</style>
<defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs>
<rect x="0" y="0" width="760" height="862" class="bg"/>
<text x="24" y="34" class="ink" font-size="15" font-weight="600">Claude judges, code counts the time, and one service writes every entry</text>
<text x="24" y="54" class="quiet" font-size="11.5">Highlighted boxes are the only doors: one for Claude calls, one for entry and audit writes.</text>
<rect x="24" y="316" width="552" height="418" rx="8" class="tint"/>
<text x="40" y="338" class="ink" font-size="13" font-weight="600">src/server</text>
<path d="M120 164V196" class="line" marker-end="url(#architecture-arrow)"/>
<path d="M296 164V354" class="line" marker-end="url(#architecture-arrow)"/>
<path d="M480 164V354" class="line" marker-end="url(#architecture-arrow)"/>
<path d="M120 284V630" class="line" marker-end="url(#architecture-arrow)"/>
<path d="M120 390H216" class="line" marker-end="url(#architecture-arrow)"/>
<path d="M120 530H216" class="line" marker-end="url(#architecture-arrow)"/>
<path d="M296 426V470" class="line" marker-end="url(#architecture-arrow)"/>
<path d="M480 426V470" class="line" marker-end="url(#architecture-arrow)"/>
<path d="M296 590V630" class="line" marker-end="url(#architecture-arrow)"/>
<path d="M376 572H388V674H400" class="line" marker-end="url(#architecture-arrow)"/>
<path d="M560 530H600" class="line" marker-end="url(#architecture-arrow)"/>
<path d="M560 674H600" class="line dash" marker-end="url(#architecture-arrow)"/>
<path d="M600 390H576" class="line" marker-end="url(#architecture-arrow)"/>
<path d="M296 734V766" class="line" marker-end="url(#architecture-arrow)"/>
<text x="128" y="368" class="quiet" font-size="11.5">run, resolve,</text>
<text x="128" y="382" class="quiet" font-size="11.5">rewrite, load</text>
<text x="128" y="508" class="quiet" font-size="11.5">edit, approve,</text>
<text x="128" y="522" class="quiet" font-size="11.5">reject, reopen</text>
<text x="128" y="614" class="quiet" font-size="11.5">export</text>
<text x="304" y="444" class="quiet" font-size="11.5">drafts, resolves,</text>
<text x="304" y="458" class="quiet" font-size="11.5">audit rows</text>
<text x="488" y="444" class="quiet" font-size="11.5">match, draft,</text>
<text x="488" y="458" class="quiet" font-size="11.5">rewrite</text>
<text x="382" y="614" class="quiet" font-size="11.5" text-anchor="end">flags</text>
<text x="488" y="240" class="quiet" font-size="11.5">each stage, not runDay</text>
<text x="304" y="754" class="quiet" font-size="11.5">one pool in src/server/db.ts, localhost only</text>
<rect x="40" y="76" width="160" height="88" rx="8" class="box"/>
<text x="52" y="100" class="ink" font-size="13" font-weight="600">Review screen</text>
<text x="52" y="116" class="ink" font-size="11.5">The attorney's page</text>
<text x="52" y="132" class="ink" font-size="11.5">Live rule checks</text>
<text x="52" y="148" class="quiet" font-size="11.5">src/app, components</text>
<rect x="216" y="76" width="160" height="88" rx="8" class="box"/>
<text x="228" y="100" class="ink" font-size="13" font-weight="600">Command line</text>
<text x="228" y="116" class="ink" font-size="11.5">Drafts one day</text>
<text x="228" y="132" class="quiet" font-size="11.5">npm run day:load</text>
<rect x="400" y="76" width="160" height="88" rx="8" class="box"/>
<text x="412" y="100" class="ink" font-size="13" font-weight="600">Eval harness</text>
<text x="412" y="116" class="ink" font-size="11.5">12 days + answer keys</text>
<text x="412" y="132" class="quiet" font-size="11.5">npm run eval</text>
<rect x="40" y="196" width="160" height="88" rx="8" class="box"/>
<text x="52" y="220" class="ink" font-size="13" font-weight="600">API routes</text>
<text x="52" y="236" class="ink" font-size="11.5">13 Next.js routes</text>
<text x="52" y="252" class="ink" font-size="11.5">Day runs stream SSE</text>
<text x="52" y="268" class="quiet" font-size="11.5">src/app/api</text>
<rect x="216" y="354" width="344" height="72" rx="8" class="box"/>
<text x="228" y="378" class="ink" font-size="13" font-weight="600">Pipeline</text>
<text x="228" y="394" class="ink" font-size="11.5">ingest → reconcile → match → draft</text>
<text x="228" y="410" class="quiet" font-size="11.5">pipeline.ts runs the last three steps</text>
<rect x="216" y="470" width="160" height="120" rx="8" class="main"/>
<text x="228" y="494" class="ink" font-size="13" font-weight="600">Entries service</text>
<text x="228" y="510" class="ink" font-size="11.5">Writes all entries,</text>
<text x="228" y="526" class="ink" font-size="11.5">flags and audit rows</text>
<text x="228" y="542" class="ink" font-size="11.5">Locks and versions</text>
<text x="228" y="558" class="quiet" font-size="11.5">entries/service.ts</text>
<rect x="400" y="470" width="160" height="120" rx="8" class="main"/>
<text x="412" y="494" class="ink" font-size="13" font-weight="600">LLM client</text>
<text x="412" y="510" class="ink" font-size="11.5">Only caller of Claude</text>
<text x="412" y="526" class="ink" font-size="11.5">JSON schema + zod</text>
<text x="412" y="542" class="ink" font-size="11.5">Caches in llm_calls</text>
<text x="412" y="558" class="ink" font-size="11.5">Oracle in tests</text>
<text x="412" y="574" class="quiet" font-size="11.5">llm/client.ts</text>
<rect x="40" y="630" width="160" height="88" rx="8" class="box"/>
<text x="52" y="654" class="ink" font-size="13" font-weight="600">LEDES export</text>
<text x="52" y="670" class="ink" font-size="11.5">Approved entries</text>
<text x="52" y="686" class="ink" font-size="11.5">to LEDES 1998B</text>
<text x="52" y="702" class="quiet" font-size="11.5">export/ledes.ts</text>
<rect x="216" y="630" width="160" height="88" rx="8" class="box"/>
<text x="228" y="654" class="ink" font-size="13" font-weight="600">Time math</text>
<text x="228" y="670" class="ink" font-size="11.5">ceil(seconds / 360)</text>
<text x="228" y="686" class="ink" font-size="11.5">Once per entry</text>
<text x="228" y="702" class="quiet" font-size="11.5">src/server/time/</text>
<rect x="400" y="630" width="160" height="88" rx="8" class="box"/>
<text x="412" y="654" class="ink" font-size="13" font-weight="600">Guideline checker</text>
<text x="412" y="670" class="ink" font-size="11.5">6 rules, in process</text>
<text x="412" y="686" class="ink" font-size="11.5">or go@1 over HTTP</text>
<text x="412" y="702" class="quiet" font-size="11.5">guidelines/rules.ts</text>
<rect x="600" y="338" width="136" height="104" rx="8" class="box"/>
<text x="612" y="362" class="ink" font-size="13" font-weight="600">Firm config</text>
<text x="612" y="378" class="ink" font-size="11.5">Matters, profiles</text>
<text x="612" y="394" class="ink" font-size="11.5">and word lists</text>
<text x="612" y="410" class="ink" font-size="11.5">read across server</text>
<text x="612" y="426" class="quiet" font-size="11.5">config/firm.yaml</text>
<rect x="600" y="486" width="136" height="88" rx="8" class="box"/>
<text x="612" y="510" class="ink" font-size="13" font-weight="600">Claude API</text>
<text x="612" y="526" class="ink" font-size="11.5">Haiku 4.5 matches</text>
<text x="612" y="542" class="ink" font-size="11.5">Sonnet 5.5 drafts</text>
<text x="612" y="558" class="ink" font-size="11.5">and rewrites</text>
<rect x="600" y="622" width="136" height="104" rx="8" class="box"/>
<text x="612" y="646" class="ink" font-size="13" font-weight="600">Go checker</text>
<text x="612" y="662" class="ink" font-size="11.5">Same rules in Go</text>
<text x="612" y="678" class="ink" font-size="11.5">used instead when</text>
<text x="612" y="694" class="ink" font-size="11.5">CHECKER_IMPL=go</text>
<text x="612" y="710" class="quiet" font-size="11.5">checker-go :8081</text>
<rect x="24" y="766" width="552" height="72" rx="8" class="box"/>
<text x="36" y="790" class="ink" font-size="13" font-weight="600">Postgres 16, local only</text>
<text x="36" y="806" class="ink" font-size="11.5">12 tables · audit_events is append-only · llm_calls caches Claude's answers</text>
<text x="36" y="822" class="quiet" font-size="11.5">time_draft_dev for the app, time_draft_eval for tests and evals</text>
</svg>
