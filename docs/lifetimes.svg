<rect x="40" y="602" width="534.2" height="12" rx="4" class="span-main"/>
<rect x="40" y="642" width="592.4" height="12" rx="4" class="span"/>
<rect x="40" y="682" width="666.0" height="12" rx="4" class="span-main"/>
<rect x="40" y="722" width="666.0" height="12" rx="4" class="span-main"/>
<text x="110.6" y="84" class="quiet" font-size="11.5" text-anchor="middle">1 min</text>
<text x="271.8" y="84" class="quiet" font-size="11.5" text-anchor="middle">1 hour</text>
<text x="397.0" y="84" class="quiet" font-size="11.5" text-anchor="middle">1 day</text>
<text x="530.9" y="84" class="quiet" font-size="11.5" text-anchor="middle">1 month</text>
<text x="629.3" y="84" class="quiet" font-size="11.5" text-anchor="middle">1 year</text>
<text x="40" y="140" class="ink" font-size="11.5">Rate limits and Claude token buckets, Redis: 60 s windows</text>
<text x="40" y="180" class="ink" font-size="11.5">Firm config, pod memory: version re-checked every 60 s; writes check every time</text>
<text x="40" y="220" class="ink" font-size="11.5">Anthropic prompt cache: 5 min from the last request that wrote or read it</text>
<text x="40" y="260" class="ink" font-size="11.5">Sessions, Redis: 30 min idle, 12 h at most; only user actions count</text>
<text x="40" y="300" class="ink" font-size="11.5">Claude replay cache, Postgres: 24 h, zod-valid answers only</text>
<text x="40" y="340" class="ink" font-size="11.5">Progress events (day_events), Postgres: 24 h, ids only</text>
<text x="40" y="380" class="ink" font-size="11.5">API responses and the day view: never cached (no-store, 304 when unchanged)</text>
<text x="40" y="476" class="ink" font-size="11.5">Jobs, Postgres: 30 days, ids only</text>
<text x="40" y="516" class="ink" font-size="11.5">Application logs, allow-listed fields only: 30 days</text>
<text x="40" y="556" class="ink" font-size="11.5">Backups: point-in-time restore 14 days, snapshots 35 days</text>
<text x="40" y="596" class="ink" font-size="11.5">Activity text and Claude quotes: 90 days after the day closes</text>
<text x="40" y="636" class="ink" font-size="11.5">Claude call metadata (llm_calls): 13 months, no prompt or answer text</text>
<text x="40" y="676" class="ink" font-size="11.5">Entries, flags and audit rows: 7 years, or the firm's policy</text>
<text x="40" y="716" class="ink" font-size="11.5">LEDES invoices, object storage under lock: 7 years</text>
<text x="40" y="756" class="ink" font-size="11.5">Prompts and answers at Anthropic: per the organization's retention setting</text>
<text x="110.6" y="810" class="quiet" font-size="11.5" text-anchor="middle">1 min</text>
<text x="271.8" y="810" class="quiet" font-size="11.5" text-anchor="middle">1 hour</text>
<text x="397.0" y="810" class="quiet" font-size="11.5" text-anchor="middle">1 day</text>
<text x="530.9" y="810" class="quiet" font-size="11.5" text-anchor="middle">1 month</text>
<text x="629.3" y="810" class="quiet" font-size="11.5" text-anchor="middle">1 year</text>
</svg>
