<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 826" width="760" height="826" role="img" aria-labelledby="title desc">
<title id="title">Caches expire or re-check within a day; records stay for years</title>
<desc id="desc"></desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; } .ink { fill: #1f1f1d; } .quiet { fill: #5f5e59; }
  .line { fill: none; stroke: #9b9a94; stroke-width: 1.25; } .guide { fill: none; stroke: #d9d8d3; stroke-width: 1.25; }
  .dash { stroke-dasharray: 4 4; } .box { fill: none; stroke: #9b9a94; stroke-width: 1.25; }
  .main { fill: #2c6ecb; fill-opacity: 0.12; stroke: #2c6ecb; stroke-width: 2; }
  .tint { fill: #f2f1ed; stroke: #9b9a94; stroke-width: 1.25; } .head { fill: #9b9a94; }
  .span { fill: #9b9a94; fill-opacity: 0.18; stroke: #9b9a94; stroke-width: 1.25; }
  .span-main { fill: #2c6ecb; fill-opacity: 0.18; stroke: #2c6ecb; stroke-width: 1.25; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1c1b; } .ink { fill: #ecebe6; } .quiet { fill: #a9a8a2; }
    .line, .box { stroke: #74736d; } .guide { stroke: #3a3936; }
    .main { fill: #6fa2ff; fill-opacity: 0.16; stroke: #6fa2ff; }
    .tint { fill: #262624; stroke: #74736d; } .head { fill: #74736d; }
    .span { fill: #74736d; stroke: #74736d; } .span-main { fill: #6fa2ff; stroke: #6fa2ff; }
  }
</style>
<defs><marker id="lifetimes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs>
<rect x="0" y="0" width="760" height="826" class="bg"/>
<text x="24" y="34" class="ink" font-size="15" font-weight="600">Caches expire or re-check within a day; records stay for years</text>
<text x="24" y="54" class="quiet" font-size="11.5">Log scale; every period is a proposed default. Accent: holds activity text or narratives.</text>
<rect x="24" y="96" width="712" height="320" rx="8" class="tint"/>
<text x="40" y="118" class="ink" font-size="13" font-weight="600">Caches and short-lived state</text>
<rect x="24" y="432" width="712" height="360" rx="8" class="tint"/>
<text x="40" y="454" class="ink" font-size="13" font-weight="600">Records, logs and backups</text>
