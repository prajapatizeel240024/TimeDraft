<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 784" width="760" height="784" role="img" aria-labelledby="title desc">
<title id="title">In production, every job, lock and record lives in Postgres; pods stay stateless</title>
<desc id="desc">Web pods answer requests and enqueue runs; workers claim jobs from Postgres, call Claude only through the LLM client and commit under a per-day lock. Every change emits a day event, so any pod can stream progress, and every cache can be dropped without losing a record.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; } .ink { fill: #1f1f1d; } .quiet { fill: #5f5e59; }
  .line { fill: none; stroke: #9b9a94; stroke-width: 1.25; } .guide { fill: none; stroke: #d9d8d3; stroke-width: 1.25; }
  .dash { stroke-dasharray: 4 4; } .box { fill: none; stroke: #9b9a94; stroke-width: 1.25; }
  .main { fill: #2c6ecb; fill-opacity: 0.12; stroke: #2c6ecb; stroke-width: 2; }
  .tint { fill: #f2f1ed; stroke: #9b9a94; stroke-width: 1.25; } .head { fill: #9b9a94; }
  .span { fill: #9b9a94; fill-opacity: 0.18; stroke: #9b9a94; stroke-width: 1.25; }
  .span-main { fill: #2c6ecb; fill-opacity: 0.18; stroke: #2c6ecb; stroke-width: 1.25; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1c1b; } .ink { fill: #ecebe6; } .quiet { fill: #a9a8a2; }
    .line, .box { stroke: #74736d; } .guide { stroke: #3a3936; }
    .main { fill: #6fa2ff; fill-opacity: 0.16; stroke: #6fa2ff; }
    .tint { fill: #262624; stroke: #74736d; } .head { fill: #74736d; }
    .span { fill: #74736d; stroke: #74736d; } .span-main { fill: #6fa2ff; stroke: #6fa2ff; }
  }
</style>
<defs><marker id="production-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs>
<rect x="0" y="0" width="760" height="784" class="bg"/>
<text x="24" y="34" class="ink" font-size="15" font-weight="600">In production, every job, lock and record lives in Postgres; pods stay stateless</text>
<text x="24" y="54" class="quiet" font-size="11.5">Highlighted: the one source of truth and the one door to Claude. TTLs are proposed defaults.</text>
<rect x="24" y="192" width="712" height="280" rx="8" class="tint"/>
<text x="40" y="214" class="ink" font-size="13" font-weight="600">Stateless pods</text>
<rect x="24" y="504" width="468" height="256" rx="8" class="tint"/>
<text x="40" y="526" class="ink" font-size="13" font-weight="600">State</text>
<path d="M248 116H268" class="line" marker-end="url(#production-arrow)"/>
<path d="M300 160V176H200V224" class="line" marker-end="url(#production-arrow)"/>
<path d="M380 160V224" class="line" marker-end="url(#production-arrow)"/>
<path d="M624 160V224" class="line" marker-end="url(#production-arrow)"/>
<path d="M624 328V352" class="line" marker-end="url(#production-arrow)"/>
<path d="M624 456V504" class="line" marker-end="url(#production-arrow)"/>
<path d="M200 328V536" class="line" marker-end="url(#production-arrow)"/>
