<text x="632" y="182" class="quiet" font-size="11.5">delta sync</text>
<text x="632" y="344" class="quiet" font-size="11.5">match, draft</text>
<text x="632" y="492" class="quiet" font-size="11.5">outside any tx</text>
<text x="388" y="492" class="quiet" font-size="11.5">NOTIFY ids</text>
<text x="208" y="492" class="quiet" font-size="11.5">tx + RLS, enqueue</text>
<rect x="24" y="72" width="224" height="88" rx="8" class="box"/>
<text x="36" y="96" class="ink" font-size="13" font-weight="600">Attorneys, reviewers</text>
<text x="36" y="112" class="ink" font-size="11.5">many firms, one app</text>
<text x="36" y="128" class="ink" font-size="11.5">sign in with firm SSO</text>
<text x="36" y="144" class="quiet" font-size="11.5">OIDC, roles per firm</text>
<rect x="268" y="72" width="224" height="88" rx="8" class="box"/>
<text x="280" y="96" class="ink" font-size="13" font-weight="600">CDN, WAF, TLS</text>
<text x="280" y="112" class="ink" font-size="11.5">assets: 1 year, immutable</text>
<text x="280" y="128" class="ink" font-size="11.5">API and SSE: no-store</text>
<rect x="512" y="72" width="224" height="88" rx="8" class="box"/>
<text x="524" y="96" class="ink" font-size="13" font-weight="600">Mail, calendar, docs</text>
<text x="524" y="112" class="ink" font-size="11.5">read-only OAuth</text>
<text x="524" y="128" class="ink" font-size="11.5">new activities only</text>
<rect x="40" y="224" width="192" height="104" rx="8" class="box"/>
<text x="52" y="248" class="ink" font-size="13" font-weight="600">Web and API</text>
<text x="52" y="264" class="ink" font-size="11.5">stateless, 3+ pods</text>
<text x="52" y="280" class="ink" font-size="11.5">SET LOCAL firm and user</text>
<text x="52" y="296" class="ink" font-size="11.5">config re-check: 60 s</text>
<rect x="284" y="224" width="192" height="104" rx="8" class="box"/>
<text x="296" y="248" class="ink" font-size="13" font-weight="600">SSE gateway</text>
<text x="296" y="264" class="ink" font-size="11.5">any pod, LISTEN</text>
<text x="296" y="280" class="ink" font-size="11.5">replays day_events</text>
<text x="296" y="296" class="ink" font-size="11.5">events kept 24 h</text>
<rect x="528" y="224" width="192" height="104" rx="8" class="box"/>
<text x="540" y="248" class="ink" font-size="13" font-weight="600">Pipeline workers</text>
<text x="540" y="264" class="ink" font-size="11.5">claim: SKIP LOCKED</text>
<text x="540" y="280" class="ink" font-size="11.5">commit under day lock</text>
<text x="540" y="296" class="ink" font-size="11.5">lease 60 s, fencing</text>
<text x="540" y="312" class="quiet" font-size="11.5">nightly purges, retention</text>
<rect x="528" y="352" width="192" height="104" rx="8" class="main"/>
<text x="540" y="376" class="ink" font-size="13" font-weight="600">LLM client</text>
<text x="540" y="392" class="ink" font-size="11.5">only door to Claude</text>
<text x="540" y="408" class="ink" font-size="11.5">zod; replay cache 24 h</text>
<text x="540" y="424" class="ink" font-size="11.5">never inside a tx</text>
<text x="540" y="440" class="quiet" font-size="11.5">rewrite from web pods</text>
<rect x="512" y="504" width="224" height="104" rx="8" class="box"/>
<text x="524" y="528" class="ink" font-size="13" font-weight="600">Claude API</text>
<text x="524" y="544" class="ink" font-size="11.5">Haiku 4.5: match</text>
<text x="524" y="560" class="ink" font-size="11.5">Sonnet 5.5: draft, rewrite</text>
<text x="524" y="576" class="ink" font-size="11.5">prompt cache: 5 min</text>
<text x="524" y="592" class="quiet" font-size="11.5">per org retention</text>
<rect x="40" y="536" width="436" height="104" rx="8" class="main"/>
<text x="52" y="560" class="ink" font-size="13" font-weight="600">Postgres primary</text>
<text x="52" y="576" class="ink" font-size="11.5">row-level security by firm, then by matter access</text>
<text x="52" y="592" class="ink" font-size="11.5">jobs, leases, day_events, day lock (days.version)</text>
<text x="52" y="608" class="ink" font-size="11.5">audit_events: INSERT only, partitioned by firm</text>
<text x="52" y="624" class="ink" font-size="11.5">llm_calls: metadata only, 13 months</text>
<rect x="40" y="656" width="210" height="88" rx="8" class="box"/>
<text x="52" y="680" class="ink" font-size="13" font-weight="600">Redis</text>
<text x="52" y="696" class="ink" font-size="11.5">sessions: 30 min idle, 12 h</text>
<text x="52" y="712" class="ink" font-size="11.5">rate limits: 60 s windows</text>
<text x="52" y="728" class="quiet" font-size="11.5">ids only, no text</text>
<rect x="266" y="656" width="210" height="88" rx="8" class="box"/>
<text x="278" y="680" class="ink" font-size="13" font-weight="600">Object storage</text>
<text x="278" y="696" class="ink" font-size="11.5">LEDES files, under lock</text>
<text x="278" y="712" class="ink" font-size="11.5">nightly audit hash roots</text>
<text x="278" y="728" class="quiet" font-size="11.5">7 years (proposed)</text>
</svg>
