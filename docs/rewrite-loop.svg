<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 914" width="760" height="914" role="img" aria-labelledby="title desc">
<title id="title">Claude only suggests; nothing is saved until the attorney clicks Save changes</title>
<desc id="desc">Rewrite with Claude only fetches a suggestion: when the sources, matter card and hint don't say what the work was for, Claude asks one question, and the attorney's answer goes back as the hint. The entry changes only when Save changes sends PATCH with via: rewrite. editEntry then clears thin_context, deletes the UNGROUNDED_TERM flags, writes one rewritten audit row and reruns the checker in one transaction.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; } .ink { fill: #1f1f1d; } .quiet { fill: #5f5e59; }
  .line { fill: none; stroke: #9b9a94; stroke-width: 1.25; } .guide { fill: none; stroke: #d9d8d3; stroke-width: 1.25; }
  .dash { stroke-dasharray: 4 4; } .box { fill: none; stroke: #9b9a94; stroke-width: 1.25; }
  .main { fill: #2c6ecb; fill-opacity: 0.12; stroke: #2c6ecb; stroke-width: 2; }
  .tint { fill: #f2f1ed; stroke: #9b9a94; stroke-width: 1.25; } .head { fill: #9b9a94; }
  .span { fill: #9b9a94; fill-opacity: 0.18; stroke: #9b9a94; stroke-width: 1.25; }
  .span-main { fill: #2c6ecb; fill-opacity: 0.18; stroke: #2c6ecb; stroke-width: 1.25; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1c1b; } .ink { fill: #ecebe6; } .quiet { fill: #a9a8a2; }
    .line, .box { stroke: #74736d; } .guide { stroke: #3a3936; }
    .main { fill: #6fa2ff; fill-opacity: 0.16; stroke: #6fa2ff; }
    .tint { fill: #262624; stroke: #74736d; } .head { fill: #74736d; }
    .span { fill: #74736d; stroke: #74736d; } .span-main { fill: #6fa2ff; stroke: #6fa2ff; }
  }
</style>
<defs><marker id="rewrite-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs>
<rect x="0" y="0" width="760" height="914" class="bg"/>
<text x="24" y="34" class="ink" font-size="15" font-weight="600">Claude only suggests; nothing is saved until the attorney clicks Save changes</text>
<text x="24" y="54" class="quiet" font-size="11.5">When the facts don't say what the work was for, Claude asks one question. Accent marks the save.</text>
<path d="M24 94H192" class="guide"/>
<path d="M208 94H368" class="guide"/>
<path d="M384 94H552" class="guide"/>
<path d="M568 94H736" class="guide"/>
<path d="M384 144H192" class="line" marker-end="url(#rewrite-loop-arrow)"/>
<path d="M108 180V208" class="line" marker-end="url(#rewrite-loop-arrow)"/>
<path d="M192 232H288V256" class="line" marker-end="url(#rewrite-loop-arrow)"/>
<path d="M368 280H468V304" class="line" marker-end="url(#rewrite-loop-arrow)"/>
<path d="M552 328H652V352" class="line" marker-end="url(#rewrite-loop-arrow)"/>
<path d="M652 440V468" class="line" marker-end="url(#rewrite-loop-arrow)"/>
<path d="M574 498H192" class="line" marker-end="url(#rewrite-loop-arrow)"/>
<path d="M652 528V574H192" class="line" marker-end="url(#rewrite-loop-arrow)"/>
<path d="M192 462H232V328" class="line" marker-end="url(#rewrite-loop-arrow)"/>
<path d="M108 630V658" class="line" marker-end="url(#rewrite-loop-arrow)"/>
<path d="M192 682H288V706" class="line" marker-end="url(#rewrite-loop-arrow)"/>
<path d="M368 730H468V754" class="line" marker-end="url(#rewrite-loop-arrow)"/>
<text x="24" y="84" class="quiet" font-size="11.5">Attorney and screen</text>
<text x="208" y="84" class="quiet" font-size="11.5">API route</text>
<text x="384" y="84" class="quiet" font-size="11.5">Server</text>
<text x="568" y="84" class="quiet" font-size="11.5">Claude</text>
<text x="212" y="138" class="quiet" font-size="11.5">shown in the entry row</text>
<text x="240" y="400" class="quiet" font-size="11.5">answer sent as hint</text>
<text x="562" y="492" class="quiet" font-size="11.5" text-anchor="end">no: needs_detail</text>
<text x="640" y="568" class="quiet" font-size="11.5" text-anchor="end">yes: rewritten</text>
<text x="212" y="676" class="quiet" font-size="11.5">with via: rewrite</text>
<text x="576" y="794" class="quiet" font-size="11.5">With thin_context false,</text>
<text x="576" y="810" class="quiet" font-size="11.5">Vague clears if the new</text>
<text x="576" y="826" class="quiet" font-size="11.5">narrative passes too</text>
<rect x="384" y="108" width="168" height="88" rx="8" class="box"/>
<text x="396" y="132" class="ink" font-size="13" font-weight="600">Thin draft</text>
<text x="396" y="148" class="ink" font-size="11.5">thin_context = true</text>
<text x="396" y="164" class="ink" font-size="11.5">Checker adds a blocking</text>
<text x="396" y="180" class="ink" font-size="11.5">VAGUE_NARRATIVE flag</text>
<rect x="24" y="108" width="168" height="72" rx="8" class="box"/>
<text x="36" y="132" class="ink" font-size="13" font-weight="600">Click Rewrite</text>
<text x="36" y="148" class="ink" font-size="11.5">On a draft's Vague flag</text>
<text x="36" y="164" class="ink" font-size="11.5">Opens the entry editor</text>
<rect x="24" y="208" width="168" height="72" rx="8" class="box"/>
<text x="36" y="232" class="ink" font-size="13" font-weight="600">Rewrite with Claude</text>
<text x="36" y="248" class="ink" font-size="11.5">Posts the hint, empty</text>
<text x="36" y="264" class="ink" font-size="11.5">the first time</text>
<rect x="208" y="256" width="160" height="72" rx="8" class="box"/>
<text x="220" y="280" class="ink" font-size="13" font-weight="600">POST .../rewrite</text>
<text x="220" y="296" class="ink" font-size="11.5">Returns a suggestion;</text>
<text x="220" y="312" class="ink" font-size="11.5">entry stays unchanged</text>
<rect x="384" y="304" width="168" height="88" rx="8" class="box"/>
<text x="396" y="328" class="ink" font-size="13" font-weight="600">suggestRewrite</text>
<text x="396" y="344" class="ink" font-size="11.5">Sends narrative, codes,</text>
<text x="396" y="360" class="ink" font-size="11.5">flag messages, sources</text>
<text x="396" y="376" class="ink" font-size="11.5">and the hint</text>
<rect x="568" y="352" width="168" height="88" rx="8" class="box"/>
<text x="580" y="376" class="ink" font-size="13" font-weight="600">rewrite.v1 prompt</text>
<text x="580" y="392" class="ink" font-size="11.5">Uses only the sources,</text>
<text x="580" y="408" class="ink" font-size="11.5">matter card and hint</text>
<text x="580" y="424" class="ink" font-size="11.5">Never invents a purpose</text>
<rect x="24" y="438" width="168" height="88" rx="8" class="box"/>
<text x="36" y="462" class="ink" font-size="13" font-weight="600">Claude asks</text>
<text x="36" y="478" class="ink" font-size="11.5">Shows the one question</text>
<text x="36" y="494" class="ink" font-size="11.5">The attorney types an</text>
<text x="36" y="510" class="ink" font-size="11.5">answer, clicks Rewrite</text>
<rect x="24" y="542" width="168" height="88" rx="8" class="box"/>
<text x="36" y="566" class="ink" font-size="13" font-weight="600">Suggested narrative</text>
<text x="36" y="582" class="ink" font-size="11.5">Fills the narrative box</text>
<text x="36" y="598" class="ink" font-size="11.5">Note counts facts_used</text>
<text x="36" y="614" class="ink" font-size="11.5">Nothing is saved yet</text>
<rect x="24" y="658" width="168" height="72" rx="8" class="main"/>
<text x="36" y="682" class="ink" font-size="13" font-weight="600">Save changes</text>
<text x="36" y="698" class="ink" font-size="11.5">Accepts the suggestion</text>
<text x="36" y="714" class="ink" font-size="11.5">and any edits to it</text>
<rect x="208" y="706" width="160" height="72" rx="8" class="box"/>
<text x="220" y="730" class="ink" font-size="13" font-weight="600">PATCH .../[id]</text>
<text x="220" y="746" class="ink" font-size="11.5">Same route as Edit</text>
<text x="220" y="762" class="ink" font-size="11.5">Calls editEntry</text>
<rect x="384" y="754" width="168" height="136" rx="8" class="main"/>
<text x="396" y="778" class="ink" font-size="13" font-weight="600">editEntry</text>
<text x="396" y="794" class="ink" font-size="11.5">One transaction:</text>
<text x="396" y="810" class="ink" font-size="11.5">thin_context = false</text>
<text x="396" y="826" class="ink" font-size="11.5">deletes the entry's</text>
<text x="396" y="842" class="ink" font-size="11.5">UNGROUNDED_TERM flags</text>
<text x="396" y="858" class="ink" font-size="11.5">one rewritten audit row</text>
<text x="396" y="874" class="ink" font-size="11.5">reruns the checker</text>
<polygon points="574,498 652,468 730,498 652,528" class="box"/>
<text x="652" y="502" class="ink" font-size="13" text-anchor="middle">Purpose known?</text>
</svg>
