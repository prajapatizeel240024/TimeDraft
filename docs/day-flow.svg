<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 936" width="760" height="936" role="img" aria-labelledby="title desc">
<title id="title">Nothing uncertain is auto-assigned: it waits in the review queue</title>
<desc id="desc">Rules and Claude both place activities, but only confident answers with real quotes go straight to drafting. Everything uncertain, including what the drafter can't place, waits for the attorney.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; } .ink { fill: #1f1f1d; } .quiet { fill: #5f5e59; }
  .line { fill: none; stroke: #9b9a94; stroke-width: 1.25; } .guide { fill: none; stroke: #d9d8d3; stroke-width: 1.25; }
  .dash { stroke-dasharray: 4 4; } .box { fill: none; stroke: #9b9a94; stroke-width: 1.25; }
  .main { fill: #2c6ecb; fill-opacity: 0.12; stroke: #2c6ecb; stroke-width: 2; }
  .tint { fill: #f2f1ed; stroke: #9b9a94; stroke-width: 1.25; } .head { fill: #9b9a94; }
  .span { fill: #9b9a94; fill-opacity: 0.18; stroke: #9b9a94; stroke-width: 1.25; }
  .span-main { fill: #2c6ecb; fill-opacity: 0.18; stroke: #2c6ecb; stroke-width: 1.25; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1c1b; } .ink { fill: #ecebe6; } .quiet { fill: #a9a8a2; }
    .line, .box { stroke: #74736d; } .guide { stroke: #3a3936; }
    .main { fill: #6fa2ff; fill-opacity: 0.16; stroke: #6fa2ff; }
    .tint { fill: #262624; stroke: #74736d; } .head { fill: #74736d; }
    .span { fill: #74736d; stroke: #74736d; } .span-main { fill: #6fa2ff; stroke: #6fa2ff; }
  }
</style>
<defs><marker id="day-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs>
<rect x="0" y="0" width="760" height="936" class="bg"/>
<text x="24" y="34" class="ink" font-size="15" font-weight="600">Nothing uncertain is auto-assigned: it waits in the review queue</text>
<text x="24" y="54" class="quiet" font-size="11.5">One day, top to bottom. The notes on the right show days.status where it changes.</text>
<path d="M380 128V160" class="line" marker-end="url(#day-flow-arrow)"/>
<path d="M380 216V248" class="line" marker-end="url(#day-flow-arrow)"/>
<path d="M380 320V352" class="line" marker-end="url(#day-flow-arrow)"/>
<path d="M380 432V488" class="line" marker-end="url(#day-flow-arrow)"/>
<path d="M380 560V592" class="line" marker-end="url(#day-flow-arrow)"/>
<path d="M380 648V680" class="line" marker-end="url(#day-flow-arrow)"/>
<path d="M380 736V768" class="line" marker-end="url(#day-flow-arrow)"/>
<path d="M380 824V856" class="line" marker-end="url(#day-flow-arrow)"/>
<path d="M500 392H560" class="line" marker-end="url(#day-flow-arrow)"/>
<path d="M648 464V512H520" class="line" marker-end="url(#day-flow-arrow)"/>
<path d="M520 536H700V464" class="line" marker-end="url(#day-flow-arrow)"/>
<path d="M240 284H112V380" class="line" marker-end="url(#day-flow-arrow)"/>
<path d="M240 524H112V484" class="line" marker-end="url(#day-flow-arrow)"/>
<text x="388" y="462" class="quiet" font-size="11.5">yes</text>
<text x="520" y="386" class="quiet" font-size="11.5">no</text>
<text x="528" y="506" class="quiet" font-size="11.5">picks a matter</text>
<text x="528" y="552" class="quiet" font-size="11.5">unplaced</text>
<text x="124" y="264" class="quiet" font-size="11.5">excluded,</text>
<text x="124" y="278" class="quiet" font-size="11.5">admin, personal</text>
<text x="124" y="518" class="quiet" font-size="11.5">not billed</text>
<text x="536" y="104" class="quiet" font-size="11.5">day: ingested</text>
<text x="536" y="192" class="quiet" font-size="11.5">day: reconciled</text>
<text x="536" y="288" class="quiet" font-size="11.5">day: matched</text>
<text x="536" y="712" class="quiet" font-size="11.5">day: drafted</text>
<rect x="240" y="72" width="280" height="56" rx="8" class="box"/>
<text x="252" y="96" class="ink" font-size="13" font-weight="600">Load the day</text>
<text x="252" y="112" class="ink" font-size="11.5">One activity per email, event, doc, call</text>
<rect x="240" y="160" width="280" height="56" rx="8" class="box"/>
<text x="252" y="184" class="ink" font-size="13" font-weight="600">Reconcile</text>
<text x="252" y="200" class="ink" font-size="11.5">A meeting takes its call log's real time</text>
<rect x="240" y="248" width="280" height="72" rx="8" class="box"/>
<text x="252" y="272" class="ink" font-size="13" font-weight="600">Match: rules, then Claude</text>
<text x="252" y="288" class="ink" font-size="11.5">Rules place clear cases first</text>
<text x="252" y="304" class="ink" font-size="11.5">Claude answers the rest, with quotes</text>
<rect x="240" y="488" width="280" height="72" rx="8" class="box"/>
<text x="252" y="512" class="ink" font-size="13" font-weight="600">Draft each matter</text>
<text x="252" y="528" class="ink" font-size="11.5">Claude groups, codes, writes narratives</text>
<text x="252" y="544" class="ink" font-size="11.5">Code validates; one repair at most</text>
<rect x="240" y="592" width="280" height="56" rx="8" class="box"/>
<text x="252" y="616" class="ink" font-size="13" font-weight="600">Create entries</text>
<text x="252" y="632" class="ink" font-size="11.5">tenths = ceil(seconds / 360), once</text>
<rect x="240" y="680" width="280" height="56" rx="8" class="box"/>
<text x="252" y="704" class="ink" font-size="13" font-weight="600">Check guidelines</text>
<text x="252" y="720" class="ink" font-size="11.5">Six rules flag entries and the day</text>
<rect x="240" y="768" width="280" height="56" rx="8" class="box"/>
<text x="252" y="792" class="ink" font-size="13" font-weight="600">Attorney reviews</text>
<text x="252" y="808" class="ink" font-size="11.5">Approve, edit, rewrite or reject</text>
<rect x="240" y="856" width="280" height="56" rx="8" class="box"/>
<text x="252" y="880" class="ink" font-size="13" font-weight="600">Export LEDES</text>
<text x="252" y="896" class="ink" font-size="11.5">Approved, billable entries per matter</text>
<rect x="560" y="344" width="176" height="120" rx="8" class="main"/>
<text x="572" y="368" class="ink" font-size="13" font-weight="600">Review queue</text>
<text x="572" y="384" class="ink" font-size="11.5">Uncertain matches and</text>
<text x="572" y="400" class="ink" font-size="11.5">unplaced activities wait</text>
<text x="572" y="416" class="ink" font-size="11.5">for the attorney</text>
<text x="572" y="432" class="quiet" font-size="11.5">Admin, personal or not</text>
<text x="572" y="448" class="quiet" font-size="11.5">work: no entry</text>
<rect x="24" y="380" width="176" height="104" rx="8" class="box"/>
<text x="36" y="404" class="ink" font-size="13" font-weight="600">Never billed</text>
<text x="36" y="420" class="ink" font-size="11.5">Merged, declined or</text>
<text x="36" y="436" class="ink" font-size="11.5">zero-time activities,</text>
<text x="36" y="452" class="ink" font-size="11.5">admin, personal, and</text>
<text x="36" y="468" class="ink" font-size="11.5">the drafter's not-billed</text>
<polygon points="260,392 380,352 500,392 380,432" class="box"/>
<text x="380" y="388" class="ink" font-size="13" text-anchor="middle">Confident, and quotes</text>
<text x="380" y="404" class="ink" font-size="13" text-anchor="middle">found in the text?</text>
</svg>
