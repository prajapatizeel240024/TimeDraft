<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 792" width="760" height="792" role="img" aria-labelledby="title desc">
<title id="title">One setting picks TypeScript or Go; both twins must pass the same 42 cases</title>
<desc id="desc">Top down: the entries service builds one input, CHECKER_IMPL sends it to rules.ts in process or to rules.go over HTTP with no fallback, and recomputeDayFlags stores the flags that come back in entry_flags. Underneath, both test suites run the same 42 golden cases, one suite per twin, and that is what keeps the twins in step.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; } .ink { fill: #1f1f1d; } .quiet { fill: #5f5e59; }
  .line { fill: none; stroke: #9b9a94; stroke-width: 1.25; } .guide { fill: none; stroke: #d9d8d3; stroke-width: 1.25; }
  .dash { stroke-dasharray: 4 4; } .box { fill: none; stroke: #9b9a94; stroke-width: 1.25; }
  .main { fill: #2c6ecb; fill-opacity: 0.12; stroke: #2c6ecb; stroke-width: 2; }
  .tint { fill: #f2f1ed; stroke: #9b9a94; stroke-width: 1.25; } .head { fill: #9b9a94; }
  .span { fill: #9b9a94; fill-opacity: 0.18; stroke: #9b9a94; stroke-width: 1.25; }
  .span-main { fill: #2c6ecb; fill-opacity: 0.18; stroke: #2c6ecb; stroke-width: 1.25; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1c1b; } .ink { fill: #ecebe6; } .quiet { fill: #a9a8a2; }
    .line, .box { stroke: #74736d; } .guide { stroke: #3a3936; }
    .main { fill: #6fa2ff; fill-opacity: 0.16; stroke: #6fa2ff; }
    .tint { fill: #262624; stroke: #74736d; } .head { fill: #74736d; }
    .span { fill: #74736d; stroke: #74736d; } .span-main { fill: #6fa2ff; stroke: #6fa2ff; }
  }
</style>
<defs><marker id="guideline-twins-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs>
<rect x="0" y="0" width="760" height="792" class="bg"/>
<text x="24" y="34" class="ink" font-size="15" font-weight="600">One setting picks TypeScript or Go; both twins must pass the same 42 cases</text>
<text x="24" y="54" class="quiet" font-size="11.5">Accent marks the twin rule files. Solid arrows run in the app; dashed arrows run in the tests.</text>
<rect x="24" y="648" width="712" height="120" rx="8" class="tint"/>
<text x="40" y="670" class="ink" font-size="13" font-weight="600">Kept in step</text>
<path d="M380 176V208" class="line" marker-end="url(#guideline-twins-arrow)"/>
<path d="M296 240H218V408" class="line" marker-end="url(#guideline-twins-arrow)"/>
<path d="M464 240H630V304" class="line" marker-end="url(#guideline-twins-arrow)"/>
<path d="M112 376V408" class="line" marker-end="url(#guideline-twins-arrow)"/>
<path d="M630 376V408" class="line" marker-end="url(#guideline-twins-arrow)"/>
<path d="M236 452H268" class="line" marker-end="url(#guideline-twins-arrow)"/>
<path d="M524 452H492" class="line" marker-end="url(#guideline-twins-arrow)"/>
<path d="M380 496V528" class="line" marker-end="url(#guideline-twins-arrow)"/>
<path d="M284 716H252" class="line dash" marker-end="url(#guideline-twins-arrow)"/>
<path d="M476 716H508" class="line dash" marker-end="url(#guideline-twins-arrow)"/>
<path d="M160 680V496" class="line dash" marker-end="url(#guideline-twins-arrow)"/>
<path d="M600 680V496" class="line dash" marker-end="url(#guideline-twins-arrow)"/>
<text x="257" y="232" class="quiet" font-size="11.5" text-anchor="middle">ts, default</text>
<text x="547" y="232" class="quiet" font-size="11.5" text-anchor="middle">go, over HTTP</text>
<text x="380" y="296" class="quiet" font-size="11.5" text-anchor="middle">getChecker() in index.ts</text>
<text x="380" y="312" class="quiet" font-size="11.5" text-anchor="middle">any other value throws</text>
<text x="380" y="624" class="quiet" font-size="11.5" text-anchor="middle">getDayView reruns the checker on each read for DAILY_TOTAL</text>
<rect x="232" y="72" width="296" height="104" rx="8" class="box"/>
<text x="244" y="96" class="ink" font-size="13" font-weight="600">Entries service</text>
<text x="244" y="112" class="quiet" font-size="11.5">On draft, edit, reject, reopen, day view</text>
<text x="244" y="128" class="ink" font-size="11.5">checkInputForDay: non-rejected entries</text>
<text x="244" y="144" class="ink" font-size="11.5">profiles: matters.profile, by matter id</text>
<text x="244" y="160" class="ink" font-size="11.5">words: config/firm.yaml, read at runtime</text>
<rect x="24" y="304" width="176" height="72" rx="8" class="box"/>
<text x="36" y="328" class="ink" font-size="13" font-weight="600">Browser editor</text>
<text x="36" y="344" class="ink" font-size="11.5">Live check as you type</text>
<text x="36" y="360" class="ink" font-size="11.5">Server rechecks on save</text>
<rect x="524" y="304" width="212" height="72" rx="8" class="box"/>
<text x="536" y="328" class="ink" font-size="13" font-weight="600">go-client.ts (go@1)</text>
<text x="536" y="344" class="ink" font-size="11.5">POST /v1/check, 2 s timeout</text>
<text x="536" y="360" class="ink" font-size="11.5">No fallback: errors if down</text>
<rect x="24" y="408" width="212" height="88" rx="8" class="main"/>
<text x="36" y="432" class="ink" font-size="13" font-weight="600">rules.ts (ts@1)</text>
<text x="36" y="448" class="ink" font-size="11.5">checkEntries, in process</text>
<text x="36" y="464" class="ink" font-size="11.5">Six rules as pure functions</text>
<text x="36" y="480" class="ink" font-size="11.5">No database, no network</text>
<rect x="268" y="408" width="224" height="88" rx="8" class="box"/>
<text x="280" y="432" class="ink" font-size="13" font-weight="600">recomputeDayFlags</text>
<text x="280" y="448" class="ink" font-size="11.5">Replaces old checker flags</text>
<text x="280" y="464" class="ink" font-size="11.5">Keeps override reasons</text>
<text x="280" y="480" class="ink" font-size="11.5">Skips DAILY_TOTAL: never stored</text>
<rect x="524" y="408" width="212" height="88" rx="8" class="main"/>
<text x="536" y="432" class="ink" font-size="13" font-weight="600">checker-go: rules.go</text>
<text x="536" y="448" class="ink" font-size="11.5">Check, served on port 8081</text>
<text x="536" y="464" class="ink" font-size="11.5">Same six rules as rules.ts</text>
<text x="536" y="480" class="ink" font-size="11.5">Standard library only</text>
<rect x="268" y="528" width="224" height="72" rx="8" class="box"/>
<text x="280" y="552" class="ink" font-size="13" font-weight="600">entry_flags</text>
<text x="280" y="568" class="ink" font-size="11.5">One row per entry flag</text>
<text x="280" y="584" class="ink" font-size="11.5">Tagged with the checker's name</text>
<rect x="40" y="680" width="212" height="72" rx="8" class="box"/>
<text x="52" y="704" class="ink" font-size="13" font-weight="600">guidelines.test.ts</text>
<text x="52" y="720" class="ink" font-size="11.5">Runs rules.ts on every case</text>
<text x="52" y="736" class="quiet" font-size="11.5">In tests/, npm run test</text>
<rect x="284" y="680" width="192" height="72" rx="8" class="box"/>
<text x="296" y="704" class="ink" font-size="13" font-weight="600">guidelines.json</text>
<text x="296" y="720" class="ink" font-size="11.5">42 golden cases</text>
<text x="296" y="736" class="quiet" font-size="11.5">In contracts/fixtures</text>
<rect x="508" y="680" width="212" height="72" rx="8" class="box"/>
<text x="520" y="704" class="ink" font-size="13" font-weight="600">rules_test.go</text>
<text x="520" y="720" class="ink" font-size="11.5">Runs rules.go on every case</text>
<text x="520" y="736" class="quiet" font-size="11.5">In checker-go, go test ./...</text>
<polygon points="296,240 380,208 464,240 380,272" class="box"/>
<text x="380" y="244" class="ink" font-size="13" text-anchor="middle">CHECKER_IMPL?</text>
</svg>
