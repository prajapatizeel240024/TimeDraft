<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1272" width="760" height="1272" role="img" aria-labelledby="title desc">
<title id="title">Rules settle clear cases; Claude's answer must pass four checks or it is queued</title>
<desc id="desc">Follow one activity down the left. A rule that applies, or a Claude answer that passes all four checks (MATCH_THRESHOLD is 0.8 by default), settles it to the right. Anything still unsure waits in the review queue, and new work is drafted at once only when the attorney picks a matter.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; } .ink { fill: #1f1f1d; } .quiet { fill: #5f5e59; }
  .line { fill: none; stroke: #9b9a94; stroke-width: 1.25; } .guide { fill: none; stroke: #d9d8d3; stroke-width: 1.25; }
  .dash { stroke-dasharray: 4 4; } .box { fill: none; stroke: #9b9a94; stroke-width: 1.25; }
  .main { fill: #2c6ecb; fill-opacity: 0.12; stroke: #2c6ecb; stroke-width: 2; }
  .tint { fill: #f2f1ed; stroke: #9b9a94; stroke-width: 1.25; } .head { fill: #9b9a94; }
  .span { fill: #9b9a94; fill-opacity: 0.18; stroke: #9b9a94; stroke-width: 1.25; }
  .span-main { fill: #2c6ecb; fill-opacity: 0.18; stroke: #2c6ecb; stroke-width: 1.25; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1c1b; } .ink { fill: #ecebe6; } .quiet { fill: #a9a8a2; }
    .line, .box { stroke: #74736d; } .guide { stroke: #3a3936; }
    .main { fill: #6fa2ff; fill-opacity: 0.16; stroke: #6fa2ff; }
    .tint { fill: #262624; stroke: #74736d; } .head { fill: #74736d; }
    .span { fill: #74736d; stroke: #74736d; } .span-main { fill: #6fa2ff; stroke: #6fa2ff; }
  }
</style>
<defs><marker id="matching-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs>
<rect x="0" y="0" width="760" height="1272" class="bg"/>
<text x="24" y="34" class="ink" font-size="15" font-weight="600">Rules settle clear cases; Claude's answer must pass four checks or it is queued</text>
<text x="24" y="54" class="quiet" font-size="11.5">Top to bottom: a right arrow settles the activity, a down arrow passes it on. Accent: the gate and the queue.</text>
<rect x="24" y="216" width="712" height="424" rx="8" class="tint"/>
<text x="40" y="238" class="ink" font-size="13" font-weight="600">Rule decisions</text>
<path d="M456 132H344" class="line dash" marker-end="url(#matching-arrow)"/>
<path d="M192 192V256" class="line" marker-end="url(#matching-arrow)"/>
<path d="M344 284H456" class="line" marker-end="url(#matching-arrow)"/>
<path d="M192 312V344" class="line" marker-end="url(#matching-arrow)"/>
<path d="M344 380H456" class="line" marker-end="url(#matching-arrow)"/>
<path d="M192 416V448" class="line" marker-end="url(#matching-arrow)"/>
<path d="M344 484H456" class="line" marker-end="url(#matching-arrow)"/>
<path d="M192 520V552" class="line" marker-end="url(#matching-arrow)"/>
<path d="M344 588H456" class="line" marker-end="url(#matching-arrow)"/>
<path d="M192 624V680" class="line" marker-end="url(#matching-arrow)"/>
<path d="M192 784V816" class="line" marker-end="url(#matching-arrow)"/>
<path d="M344 876H456" class="line" marker-end="url(#matching-arrow)"/>
<path d="M192 936V976" class="line" marker-end="url(#matching-arrow)"/>
<path d="M192 1064V1104" class="line" marker-end="url(#matching-arrow)"/>
<path d="M344 1132H456" class="line" marker-end="url(#matching-arrow)"/>
<path d="M344 1212H456" class="line" marker-end="url(#matching-arrow)"/>
<text x="204" y="238" class="quiet" font-size="11.5">in order; the first that applies wins</text>
<text x="400" y="276" class="quiet" font-size="11.5" text-anchor="middle">yes</text>
<text x="204" y="332" class="quiet" font-size="11.5">no</text>
<text x="204" y="664" class="quiet" font-size="11.5">no rule applies</text>
<text x="400" y="868" class="quiet" font-size="11.5" text-anchor="middle">all four pass</text>
<text x="204" y="960" class="quiet" font-size="11.5">any check fails, or no answer</text>
<text x="204" y="1088" class="quiet" font-size="11.5">Needs a matter panel</text>
<text x="400" y="1126" class="quiet" font-size="11.5" text-anchor="middle">a matter</text>
<text x="400" y="1206" class="quiet" font-size="11.5" text-anchor="middle">other buttons</text>
<rect x="40" y="72" width="304" height="120" rx="8" class="box"/>
<text x="52" y="96" class="ink" font-size="13" font-weight="600">Score every matter</text>
<text x="52" y="112" class="ink" font-size="11.5">Uses each matter's parties, domains,</text>
<text x="52" y="128" class="ink" font-size="11.5">keywords and doc folders</text>
<text x="52" y="144" class="ink" font-size="11.5">Keeps the strongest weight per kind</text>
<text x="52" y="160" class="ink" font-size="11.5">score = 1 - (1 - w1)(1 - w2)...</text>
<text x="52" y="176" class="quiet" font-size="11.5">e.g. 0.80 and 0.30 combine to 0.86</text>
<rect x="456" y="72" width="264" height="120" rx="8" class="box"/>
<text x="468" y="96" class="ink" font-size="13" font-weight="600">Nine rule signals</text>
<text x="468" y="112" class="ink" font-size="11.5">matter number 0.95, doc folder 0.90</text>
<text x="468" y="128" class="ink" font-size="11.5">client domain 0.80, contact phone 0.80</text>
<text x="468" y="144" class="ink" font-size="11.5">party domain 0.75, client name 0.70</text>
<text x="468" y="160" class="ink" font-size="11.5">party name 0.60, shared contact 0.40</text>
<text x="468" y="176" class="ink" font-size="11.5">keyword 0.30</text>
<rect x="40" y="256" width="304" height="56" rx="8" class="box"/>
<text x="52" y="280" class="ink" font-size="13" font-weight="600">1. Excluded?</text>
<text x="52" y="296" class="ink" font-size="11.5">Merged call, declined event, 0 seconds</text>
<rect x="456" y="256" width="264" height="56" rx="8" class="box"/>
<text x="468" y="280" class="ink" font-size="13" font-weight="600">Ignored</text>
<text x="468" y="296" class="ink" font-size="11.5">status ignored, never drafted</text>
<rect x="40" y="344" width="304" height="72" rx="8" class="box"/>
<text x="52" y="368" class="ink" font-size="13" font-weight="600">2. Personal?</text>
<text x="52" y="384" class="ink" font-size="11.5">Calendar title has a personal word</text>
<text x="52" y="400" class="ink" font-size="11.5">and no matter scores 0.6 or more</text>
<rect x="456" y="352" width="264" height="56" rx="8" class="box"/>
<text x="468" y="376" class="ink" font-size="13" font-weight="600">Personal</text>
<text x="468" y="392" class="ink" font-size="11.5">status auto, never billed</text>
<rect x="40" y="448" width="304" height="72" rx="8" class="box"/>
<text x="52" y="472" class="ink" font-size="13" font-weight="600">3. Clear winner?</text>
<text x="52" y="488" class="ink" font-size="11.5">Top matter scores 0.85 or more</text>
<text x="52" y="504" class="ink" font-size="11.5">and leads the next by 0.3 or more</text>
<rect x="456" y="456" width="264" height="56" rx="8" class="box"/>
<text x="468" y="480" class="ink" font-size="13" font-weight="600">On the top matter</text>
<text x="468" y="496" class="ink" font-size="11.5">status auto, billable, drafted next</text>
<rect x="40" y="552" width="304" height="72" rx="8" class="box"/>
<text x="52" y="576" class="ink" font-size="13" font-weight="600">4. Admin?</text>
<text x="52" y="592" class="ink" font-size="11.5">Admin sender, phone or word</text>
<text x="52" y="608" class="ink" font-size="11.5">and no matter scores 0.6 or more</text>
<rect x="456" y="560" width="264" height="56" rx="8" class="box"/>
<text x="468" y="584" class="ink" font-size="13" font-weight="600">Admin</text>
<text x="468" y="600" class="ink" font-size="11.5">status auto, never billed</text>
<rect x="40" y="680" width="304" height="104" rx="8" class="box"/>
<text x="52" y="704" class="ink" font-size="13" font-weight="600">Claude, one call a day</text>
<text x="52" y="720" class="ink" font-size="11.5">Gets every leftover in one batch</text>
<text x="52" y="736" class="ink" font-size="11.5">Sees its text and up to 4 neighbours</text>
<text x="52" y="752" class="ink" font-size="11.5">Returns matter or NONE, category,</text>
<text x="52" y="768" class="ink" font-size="11.5">confidence, 1 to 3 quotes and a why</text>
<rect x="40" y="816" width="304" height="120" rx="8" class="main"/>
<text x="52" y="840" class="ink" font-size="13" font-weight="600">Four-check gate</text>
<text x="52" y="856" class="ink" font-size="11.5">Confidence at least MATCH_THRESHOLD</text>
<text x="52" y="872" class="ink" font-size="11.5">1+ quotes, all found in what Claude saw</text>
<text x="52" y="888" class="ink" font-size="11.5">No rival rule score of 0.6 or more</text>
<text x="52" y="904" class="ink" font-size="11.5">Category fits: billable names a matter,</text>
<text x="52" y="920" class="ink" font-size="11.5">admin or personal uses NONE</text>
<rect x="456" y="840" width="264" height="72" rx="8" class="box"/>
<text x="468" y="864" class="ink" font-size="13" font-weight="600">Placed by Claude</text>
<text x="468" y="880" class="ink" font-size="11.5">status auto, quotes kept as evidence</text>
<text x="468" y="896" class="ink" font-size="11.5">Billable work is drafted next</text>
<rect x="40" y="976" width="304" height="88" rx="8" class="main"/>
<text x="52" y="1000" class="ink" font-size="13" font-weight="600">Review queue</text>
<text x="52" y="1016" class="ink" font-size="11.5">Waits as needs_review, never guessed</text>
<text x="52" y="1032" class="ink" font-size="11.5">Claude's answer kept as a suggestion</text>
<text x="52" y="1048" class="quiet" font-size="11.5">Drafter's unplaced work returns here</text>
<rect x="40" y="1104" width="304" height="120" rx="8" class="box"/>
<text x="52" y="1128" class="ink" font-size="13" font-weight="600">Attorney places it</text>
<text x="52" y="1144" class="ink" font-size="11.5">Sees Claude's pick and how sure it is</text>
<text x="52" y="1160" class="ink" font-size="11.5">Buttons: each matter, Admin,</text>
<text x="52" y="1176" class="ink" font-size="11.5">Personal and Not work</text>
<text x="52" y="1192" class="ink" font-size="11.5">Same-thread queued emails follow</text>
<text x="52" y="1208" class="quiet" font-size="11.5">One resolved audit row per activity</text>
<rect x="456" y="1104" width="264" height="56" rx="8" class="box"/>
<text x="468" y="1128" class="ink" font-size="13" font-weight="600">Drafted at once</text>
<text x="468" y="1144" class="ink" font-size="11.5">status resolved; draftDay runs now</text>
<rect x="456" y="1176" width="264" height="72" rx="8" class="box"/>
<text x="468" y="1200" class="ink" font-size="13" font-weight="600">Nothing drafted</text>
<text x="468" y="1216" class="ink" font-size="11.5">Admin or Personal: status resolved</text>
<text x="468" y="1232" class="ink" font-size="11.5">Not work: status ignored</text>
</svg>
