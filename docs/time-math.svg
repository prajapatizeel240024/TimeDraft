<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" width="760" height="438" role="img" aria-labelledby="title desc">
<title id="title">Overlaps count once, emails add on top, and each entry rounds up once</title>
<desc id="desc">entrySeconds counts the 30 minutes that the doc session and the call share only once, so the two spans give 5,400 s, not 7,200. It then adds the email's 240 s estimate on top, because emails have no reliable span. createDraftEntry rounds the 5,640 s total up once with toTenths: ceil(5,640 / 360) = 16. It stores that integer, capped at 240, beside the unrounded raw_seconds, and nothing downstream rounds again.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; } .ink { fill: #1f1f1d; } .quiet { fill: #5f5e59; }
  .line { fill: none; stroke: #9b9a94; stroke-width: 1.25; } .guide { fill: none; stroke: #d9d8d3; stroke-width: 1.25; }
  .dash { stroke-dasharray: 4 4; } .box { fill: none; stroke: #9b9a94; stroke-width: 1.25; }
  .main { fill: #2c6ecb; fill-opacity: 0.12; stroke: #2c6ecb; stroke-width: 2; }
  .tint { fill: #f2f1ed; stroke: #9b9a94; stroke-width: 1.25; } .head { fill: #9b9a94; }
  .span { fill: #9b9a94; fill-opacity: 0.18; stroke: #9b9a94; stroke-width: 1.25; }
  .span-main { fill: #2c6ecb; fill-opacity: 0.18; stroke: #2c6ecb; stroke-width: 1.25; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1c1c1b; } .ink { fill: #ecebe6; } .quiet { fill: #a9a8a2; }
    .line, .box { stroke: #74736d; } .guide { stroke: #3a3936; }
    .main { fill: #6fa2ff; fill-opacity: 0.16; stroke: #6fa2ff; }
    .tint { fill: #262624; stroke: #74736d; } .head { fill: #74736d; }
    .span { fill: #74736d; stroke: #74736d; } .span-main { fill: #6fa2ff; stroke: #6fa2ff; }
  }
</style>
<defs><marker id="time-math-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs>
<rect x="0" y="0" width="760" height="438" class="bg"/>
<text x="24" y="34" class="ink" font-size="15" font-weight="600">Overlaps count once, emails add on top, and each entry rounds up once</text>
<text x="24" y="54" class="quiet" font-size="11.5">Bars to scale. Doc and call as in tests/intervals.test.ts, plus a 240 s email; accent marks the overlap.</text>
<rect x="24" y="72" width="712" height="222" rx="8" class="tint"/>
<text x="40" y="94" class="ink" font-size="13" font-weight="600">entrySeconds totals the sources</text>
<rect x="56" y="130" width="178" height="16" rx="4" class="span"/>
<rect x="238" y="130" width="176" height="16" rx="4" class="span-main"/>
<rect x="238" y="180" width="176" height="16" rx="4" class="span-main"/>
<rect x="418" y="180" width="178" height="16" rx="4" class="span"/>
<rect x="56" y="230" width="178" height="16" rx="4" class="span"/>
<rect x="238" y="230" width="176" height="16" rx="4" class="span-main"/>
<rect x="418" y="230" width="178" height="16" rx="4" class="span"/>
<rect x="600" y="262" width="24" height="16" rx="4" class="span"/>
<path d="M134 294V326" class="line" marker-end="url(#time-math-arrow)"/>
<path d="M244 370H270" class="line" marker-end="url(#time-math-arrow)"/>
<path d="M498 370H524" class="line" marker-end="url(#time-math-arrow)"/>
<text x="56" y="122" class="quiet" font-size="11.5">Doc session: 60 min, 3,600 s</text>
<text x="238" y="172" class="quiet" font-size="11.5">Call: 60 min, 3,600 s, starts 30 min later</text>
<text x="226" y="192" class="quiet" font-size="11.5" text-anchor="end">30 min overlap</text>
<text x="56" y="222" class="quiet" font-size="11.5">Union: 90 min, 5,400 s, not 7,200; overlap counted once</text>
<text x="588" y="274" class="quiet" font-size="11.5" text-anchor="end">Email: 240 s estimate, no span, added on top</text>
<text x="636" y="274" class="quiet" font-size="11.5">= 5,640 s</text>
<rect x="24" y="326" width="220" height="88" rx="8" class="box"/>
<text x="36" y="350" class="ink" font-size="13" font-weight="600">Round up once</text>
<text x="36" y="366" class="ink" font-size="11.5">toTenths: ceil(seconds / 360)</text>
<text x="36" y="382" class="ink" font-size="11.5">5,640 / 360 = 15.67, up to 16</text>
<text x="36" y="398" class="ink" font-size="11.5">Any started tenth bills in full</text>
<rect x="270" y="326" width="228" height="88" rx="8" class="box"/>
<text x="282" y="350" class="ink" font-size="13" font-weight="600">Stored on the entry</text>
<text x="282" y="366" class="ink" font-size="11.5">units_tenths = min(240, 16) = 16</text>
<text x="282" y="382" class="ink" font-size="11.5">raw_seconds = 5,640, unrounded</text>
<text x="282" y="398" class="quiet" font-size="11.5">Both set by createDraftEntry</text>
<rect x="524" y="326" width="212" height="88" rx="8" class="box"/>
<text x="536" y="350" class="ink" font-size="13" font-weight="600">Never rounded again</text>
<text x="536" y="366" class="ink" font-size="11.5">Day totals, daily check, LEDES</text>
<text x="536" y="382" class="ink" font-size="11.5">add integer tenths</text>
<text x="536" y="398" class="quiet" font-size="11.5">formatHours: 16 shows as 1.6</text>
</svg>
