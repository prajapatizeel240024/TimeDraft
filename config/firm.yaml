# TimeDraft firm configuration: the single source of truth for the firm, the matters, the
# contacts, the guideline profiles and the word lists. It feeds the seed, the matcher, the
# prompts and the checker. Everything is synthetic: .example domains are reserved and
# 555-01xx phone numbers are fictional.

